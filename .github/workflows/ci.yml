name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # fail_under gate applies per leg: the package has no version-specific
      # branches, so combined coverage equals per-leg coverage
      - run: uv run pytest --cov --hypothesis-profile=ci

  okf:
    # OKF v0.2 conformance of a real brain, checked by an independent
    # validator (not brainkit's own tests): the eval corpus, ingested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          uv run python -c "import sys; from pathlib import Path;
          sys.path.insert(0, 'tests/eval'); from brain_builder import
          build_brain; build_brain(Path(sys.argv[1]))" "$RUNNER_TEMP/okf"
      - uses: scaccogatto/okf-skills@9919c161a7f0dd99a0ecb736efa3fa9e0c9da297 # okf--v0.11.0
        with:
          bundle: ${{ runner.temp }}/okf/brain

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, okf]
    if: always()
    steps:
      - name: Fail if any needed job did not succeed
        env:
          ANY_BAD:
            ${{ contains(needs.*.result, 'failure') || contains(needs.*.result,
            'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [[ "$ANY_BAD" == "true" ]]; then
            echo "::error::A required job failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All checks passed."
